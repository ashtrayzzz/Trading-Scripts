[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false

[project]
name = "trading-automations"
version = "0.1.0"
description = "Modular trading intelligence system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=0.52.0",
    "ccxt>=4.5.78",
    "google-generativeai>=0.8.0",
    "numpy>=2.5.3",
    "openai>=1.80.0",
    "pandas>=3.0.5",
    "plotly>=7.1.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "ta>=0.11.0",
    "typer>=0.27.2",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
